name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  name-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Block internal project names
        env:
          BLOCKED_TERMS: ${{ vars.BLOCKED_TERMS }}
        run: bash scripts/check-names.sh
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # test-and-lint: added once the skeleton exists after 10:45
  # (install, lint, test with timeouts; nothing merges red).
